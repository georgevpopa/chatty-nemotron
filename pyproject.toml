[project]
name = "chatty-nemotron"
version = "1.3.2"
description = "Professional Streamlit Interface for Nemotron-3-Ultra-550B"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Your Name", email = "you@example.com"}]
keywords = ["streamlit", "llm", "ai", "nvidia", "nemotron", "chat"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Framework :: Streamlit",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "streamlit>=1.35.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "bandit>=1.7.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = ["pytest", "ruff", "mypy", "bandit", "pre-commit"]

[tool.ruff]
target-version = "py311"
line-length = 120
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "DTZ", "T20", "SIM", "ARG", "PTH", "ERA", "PL", "TRY", "NPY", "RSE", "FA", "LOG", "TCH", "INT", "PIE", "PT", "Q", "RET", "SLF", "SLOT", "TID", "UN", "ASYNC"]
ignore = ["S101", "TRY003", "ARG001", "ARG002"]
fixable = ["ALL"]
exclude = [".venv", "dist", "build", ".git", "__pycache__", ".streamlit"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true
exclude = [".venv", "build", "dist", ".streamlit"]

[[tool.mypy.overrides]]
module = ["streamlit*", "openai*", "pydantic*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config"
markers = [
    "unit: Fast unit tests",
    "integration: Integration tests (require API keys)",
]

[tool.bandit]
exclude_dirs = [".venv", "tests", "app/tests", ".streamlit"]
skips = ["B101", "B601"]