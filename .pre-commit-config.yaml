repos:
  # Meta: update pre-commit itself
  - repo: https://github.com/pre-commit/pre-commit
    rev: v3.6.0
    hooks:
      - id: validate_manifest

  # Formatting & Linting (Ruff = Flake8 + isort + black + more)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff
        name: Ruff Lint
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: Ruff Format

  # Type Checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      - id: mypy
        name: MyPy Type Check
        additional_dependencies: [types-requests, types-python-dotenv]
        args: [--strict, --show-error-codes, --pretty]
        exclude: ^\.streamlit/

  # Security (Bandit)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.0
    hooks:
      - id: bandit
        name: Bandit Security Scan
        args: [-r, app, -ll, -x, .venv,tests]
        exclude: ^app/tests/

  # Generic hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key
      - id: check-merge-conflict

  # Dockerfile Lint (Hadolint)
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        name: Hadolint Dockerfile
        entry: hadolint
        language: docker_image
        types: [dockerfile]
        args: [--failure-threshold=warning]

  # Secret Detection (TruffleHog - fast, no false positives on verified keys)
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.63.0
    hooks:
      - id: trufflehog
        name: TruffleHog Secret Scan
        args: [filesystem, --directory=., --fail, --no-verification]
        exclude: ^(\.venv|\.git)/