<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatty Nemotron Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1e1e1e; color: #fff; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        #chatbox { width: 100%; height: 500px; background: #2d2d2d; border-radius: 8px; padding: 15px; overflow-y: auto; margin-bottom: 15px; border: 1px solid #444; box-sizing: border-box; }
        .input-group { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #444; background: #333; color: #fff; border-radius: 4px; outline: none; }
        input:focus { border-color: #28a745; }
        button { padding: 12px 24px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        .user-msg { color: #00bcd4; margin-bottom: 10px; }
        .ai-msg { color: #28a745; margin-bottom: 15px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Chatty Nemotron UI v1.3.2</h2>
        <div id="chatbox"></div>
        <div class="input-group">
            <input id="userInput" type="text" placeholder="Scrie un mesaj pentru Nemotron-3-Ultra..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Trimite</button>
        </div>
    </div>

    <script>
    async function sendMessage() {
        const input = document.getElementById('userInput');
        const box = document.getElementById('chatbox');
        const prompt = input.value.trim();
        if(!prompt) return;
        
        box.innerHTML += `<div class="user-msg"><strong>Tu:</strong> ${prompt}</div>`;
        input.value = '';
        box.scrollTop = box.scrollHeight;
        
        try {
            const res = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: prompt})
            });
            const data = await res.json();
            box.innerHTML += `<div class="ai-msg"><strong>AI:</strong> ${data.response}</div>`;
        } catch (error) {
            box.innerHTML += `<div class="ai-msg" style="color: #dc3545;"><strong>Eroare:</strong> Conexiunea cu serverul a eșuat.</div>`;
        }
        box.scrollTop = box.scrollHeight;
    }
    </script>
</body>
</html>
